<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RemoteCI 控制台</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="topbar">
    <span class="topbar-title">RemoteCI AstrbotConnector</span>
    <span class="topbar-sub" id="clock"></span>
</div>
<div class="layout">
    <nav class="subnav" id="nav">
        <button class="nav-item active" data-view="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>概览</span></button>
        <button class="nav-item" data-view="bindings"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span>账号绑定</span></button>
        <button class="nav-item" data-view="sessions"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>会话与推送</span></button>
        <button class="nav-item" data-view="reminders"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>提醒设置</span></button>
        <button class="nav-item" data-view="holidays"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>节假日</span></button>
        <button class="nav-item" data-view="log"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>推送记录</span></button>
    </nav>
    <main class="content" id="app">
        <div class="empty">正在加载…</div>
    </main>
</div>
<button class="fab" id="fab" hidden title="保存"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button>
<div class="snackbar" id="toast"></div>
<script src="/api/plugin/page/bridge-sdk.js"></script>
<script src="./app.js"></script>
</body>
</html>
