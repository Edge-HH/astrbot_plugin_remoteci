<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RemoteCI 控制台</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
<aside class="sidebar">
    <div class="brand">
        <span class="brand-badge"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></span>
        <span class="brand-copy"><strong>RemoteCI</strong><small>AstrBot 课表助手</small></span>
    </div>
    <nav class="side-nav" id="nav">
        <button class="nav-link active" data-view="overview"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>概览</span></button>
        <button class="nav-link" data-view="bindings"><svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span>账号绑定</span></button>
        <button class="nav-link" data-view="sessions"><svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>会话与推送</span></button>
        <button class="nav-link" data-view="reminders"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>提醒设置</span></button>
        <button class="nav-link" data-view="holidays"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>节假日</span></button>
        <button class="nav-link" data-view="log"><svg class="icon" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>推送记录</span></button>
    </nav>
    <div class="sidebar-note"><strong>指令</strong><span>聊天中发送 /rci 帮助 查看全部指令，也可以直接用自然语言。</span></div>
</aside>

<main class="app-frame">
    <div class="shell" id="app">
        <div class="empty-state"><strong>正在加载…</strong></div>
    </div>
</main>
<div class="toast" id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
